---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Validate

# A broken preset stops Renovate in every repo that uses it, all at once. Check every preset
# before it reaches master.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate presets
    runs-on: ubuntu-latest
    env:
      # Keep this on the same Renovate version as the self-hosted runner: a preset that this
      # version accepts can still fail on an older runner.
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: 44.145.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate presets
        run: >-
          npx --yes --package "renovate@${RENOVATE_VERSION}" --
          renovate-config-validator --strict --no-global
          default.json ./*.json5 .renovaterc.json5
